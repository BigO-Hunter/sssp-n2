name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build O(n^2) row submission
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lean and cached Mathlib dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: .
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      # The lakefile also declares Frontier / VerifierChallenge / VerifierAudit
      # libs, but this tree carries only the Submission sources; build the
      # proof target explicitly rather than the empty legacy libs.
      - name: Build the Submission proof
        run: lake build Submission
